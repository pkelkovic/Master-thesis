apiVersion: apps/v1
kind: Deployment
metadata:
  name: aggregator1
  labels:
    app: aggregator1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aggregator1
  template:
    metadata:
      labels:
        app: aggregator1
    spec:
      containers:
      - name: aggregator1
        image: petrakelkovic/aggregator-jib:05
        ports:
        - containerPort: 8091
        envFrom:
          - configMapRef:
              name: aggregator1-config
          - configMapRef:
              name: aggregator-config
          - secretRef:
              name: aggregator-secret
        env:
          - name: MQTT_CLIENT_ID
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
---
apiVersion: v1
kind: Service
metadata:
  name: aggregator1-service
spec:
  type: ClusterIP
  selector:
    app: aggregator1
  ports:
    - protocol: TCP
      port: 8091
      targetPort: 8091
